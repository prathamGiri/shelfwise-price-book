<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>Shelfwise</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="views">
    <section class="view" id="view-check" data-view="check"></section>
    <section class="view" id="view-book" data-view="book" hidden></section>
    <section class="view" id="view-list" data-view="list" hidden></section>
    <section class="view" id="view-more" data-view="more" hidden></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab active" data-act="tab" data-tab="check" aria-label="Deal Check"><span class="tab-ic" data-ic="tag"></span><span>Check</span></button>
    <button class="tab" data-act="tab" data-tab="book" aria-label="Price Book"><span class="tab-ic" data-ic="book"></span><span>Book</span></button>
    <button class="tab" data-act="tab" data-tab="list" aria-label="Shopping List"><span class="tab-ic" data-ic="list"></span><span>List</span><i class="tab-badge" id="listBadge" hidden></i></button>
    <button class="tab" data-act="tab" data-tab="more" aria-label="More"><span class="tab-ic" data-ic="more"></span><span>More</span><i class="tab-badge dot" id="moreBadge" hidden></i></button>
  </nav>
  <div id="panels"></div>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js"></script>
</body>
</html>
